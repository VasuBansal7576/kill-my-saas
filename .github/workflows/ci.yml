name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: programflow
          POSTGRES_PASSWORD: programflow_test
          POSTGRES_DB: programflow
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U programflow -d programflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://programflow:programflow_test@127.0.0.1:5432/programflow
      APP_ENV: evaluation
      EVALUATION_RUN_ID: ci-golden-path
      EVALUATION_DATABASE_SCOPE: run_scoped
      EVALUATION_SEED_CONFIRM: CREATE ci-golden-path
      EVALUATION_RESET_CONFIRM: RESET ci-golden-path
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run db:migrate
      - run: npm run seed:evaluation
      - run: npm run seed:evaluation
      - run: npm run check
